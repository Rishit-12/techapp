spring.application.name=spring-boot-ecommerce
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/full-stack-ecommerce1?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ecommerceapp
spring.datasource.password=${DB_PASSWORD}
spring.data.rest.base-path=/api
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:http://localhost:8080}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://rish-12.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://rish-12.us.auth0.com/.well-known/jwks.json
spring.data.rest.detection-strategy=annotated
server.port=8443
allowed.origins=${ALLOWED_ORIGINS:http://localhost:4200}
server.ssl.enabled=true
server.ssl.key-alias=luv2code
server.ssl.key-store=classpath:luv2code-keystore.p12
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12
stripe.key.secret=${STRIPE_SECRET_KEY}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://rish-12.us.auth0.com/.well-known/jwks.json