spring.application.name=spring-boot-ecommerce
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.data.rest.base-path=/api

spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:http://localhost:8080}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://rish-12.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://rish-12.us.auth0.com/.well-known/jwks.json

spring.data.rest.detection-strategy=annotated
allowed.origins=${ALLOWED_ORIGINS:http://localhost:4200}

server.port=${PORT:8080}
server.ssl.enabled=false